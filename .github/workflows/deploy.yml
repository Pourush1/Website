name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Published with the site so the verify step can tell which commit is live.
      - name: Write version marker
        run: echo "$GITHUB_SHA" > out/deploy-version.txt

      # The FTP account's home directory is the site's public_html, so ./ is the live root.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./

      # Fails the run if the upload didn't land in the folder the site is served from.
      - name: Verify live site serves this commit
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS "https://pourushshrestha.com/deploy-version.txt?run=$GITHUB_RUN_ID-$i" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live site is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $i: live version is '${live:-<missing>}', expected $GITHUB_SHA"
            sleep 10
          done
          echo "::error::Deploy finished but pourushshrestha.com is not serving this commit. The FTP upload went to the wrong folder."
          exit 1
